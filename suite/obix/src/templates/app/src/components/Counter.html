<div class="counter">
  <h2 class="counter__title">{label}</h2>
  <p class="counter__value" role="status" aria-live="polite">{display}</p>
  <div class="counter__actions">
    <button type="button" data-on-click="Decrement" aria-label="Decrease">&minus;</button>
    <button type="button" data-on-click="Reset" data-bind-disabled="isZero">Reset</button>
    <button type="button" data-on-click="Increment" aria-label="Increase">+</button>
  </div>
</div>
